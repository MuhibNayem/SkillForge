services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: learnhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U learnhub" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 30s
      timeout: 10s
      retries: 3

  kong-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kong" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.5
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: password
      KONG_PASSWORD: password
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy

  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: password
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      kong-db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"

  auth-service:
    build:
      context: ./server
      dockerfile: services/auth/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./server
      dockerfile: services/user/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tenant-service:
    build:
      context: ./server
      dockerfile: services/tenant/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  course-service:
    build:
      context: ./server
      dockerfile: services/course/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  content-service:
    build:
      context: ./server
      dockerfile: services/content/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      MONGO_URI: mongodb://admin:password@mongodb:27017
      MINIO_URL: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  enrollment-service:
    build:
      context: ./server
      dockerfile: services/enrollment/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  assessment-service:
    build:
      context: ./server
      dockerfile: services/assessment/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  certification-service:
    build:
      context: ./server
      dockerfile: services/certification/Dockerfile
    environment:
      APP_ENV: production
      PORT: "9090"
      DB_URL: postgres://learnhub:password@postgres:5432/learnhub?sslmode=disable
      MINIO_URL: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  kong_data:
  elasticsearch_data:

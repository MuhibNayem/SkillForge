syntax = "proto3";

package learnhub.enrollment.v1;

option go_package = "github.com/amnayem/skillforge/shared/pb/enrollmentpb";

service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollmentResponse);
  rpc GetEnrollment(GetEnrollmentRequest) returns (EnrollmentResponse);
  rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse);
  rpc UpdateProgress(UpdateProgressRequest) returns (ProgressResponse);
  rpc GetProgress(GetProgressRequest) returns (ProgressResponse);
}

message EnrollRequest {
  string user_id = 1;
  string course_id = 2;
  string tenant_id = 3;
}

message GetEnrollmentRequest {
  string enrollment_id = 1;
}

message ListEnrollmentsRequest {
  string user_id = 1;
  string tenant_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListEnrollmentsResponse {
  repeated EnrollmentResponse enrollments = 1;
  int32 total = 2;
}

message UpdateProgressRequest {
  string enrollment_id = 1;
  string lesson_id = 2;
  int32 percent_complete = 3;
}

message GetProgressRequest {
  string enrollment_id = 1;
}

message EnrollmentResponse {
  string enrollment_id = 1;
  string user_id = 2;
  string course_id = 3;
  string status = 4;
  int32 overall_progress = 5;
  int64 enrolled_at = 6;
  int64 completed_at = 7;
}

message ProgressResponse {
  string enrollment_id = 1;
  int32 overall_progress = 2;
  repeated LessonProgress lessons = 3;
}

message LessonProgress {
  string lesson_id = 1;
  int32 percent_complete = 2;
  int64 last_accessed = 3;
}

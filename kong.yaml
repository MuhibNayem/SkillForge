_format_version: "3.0"
services:
  - name: auth-service
    url: grpc://auth-service:9090
    routes:
      - name: auth-rest-proxy
        paths:
          - /api/v1/auth
        protocols:
          - http
          - https
    plugins:
      - name: grpc-gateway
        config:
          proto: /opt/kong/proto/auth.proto
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Total-Count
          credentials: true
          max_age: 3600

  - name: user-service
    url: grpc://user-service:9090
    routes:
      - name: user-rest-proxy
        paths:
          - /api/v1/users
        protocols:
          - http
          - https
    plugins:
      - name: grpc-gateway
        config:
          proto: /opt/kong/proto/user.proto
      - name: jwt
        config:
          cookie_names:
            - access_token
          claims_to_verify:
            - exp
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
          headers:
            - Authorization
            - Content-Type
          credentials: true

